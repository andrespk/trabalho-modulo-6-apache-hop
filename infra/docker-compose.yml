version: '3.8'

services:
  hop-engine:
    image: apache/hop:2.19.0
    container_name: hop-engine
    environment:
      - HOP_SERVER_USER=cluster
      - HOP_SERVER_PASS=cluster
      - HOP_SERVER_PORT=8080
      - HOP_PROJECT_NAME=hop-project
      - HOP_PROJECT_DIRECTORY=/files/hop-project
      - HOP_PROJECT_FOLDER=/files/hop-project
      - HOP_PROJECT_CONFIG_FILE=/files/hop-project/project-config.json
      - HOP_ENVIRONMENT_NAME=local
      - HOP_ENVIRONMENT_CONFIG_FILE=/files/hop-project/project-config.json
      - HOP_LOG_LEVEL=Basic
    volumes:
      - ../:/files
      - ./sqlite:/files/infra/sqlite
      - ../database:/files/database
      - ../hop-project:/files/hop-project
      - hop_plugins:/opt/hop/plugins
    networks:
      - hop-network
    ports:
      - "8081:8080"
    restart: unless-stopped

  hop-web:
    image: apache/hop-web:2.19.0
    container_name: hop-web
    environment:
      - HOP_AES_ENCRYPTION_KEY=HopUEA2024SecretKey
      - HOP_PROJECT_NAME=hop-project
      - HOP_PROJECT_DIRECTORY=/files/hop-project
      - HOP_PROJECT_FOLDER=/files/hop-project
      - HOP_PROJECT_CONFIG_FILE=/files/hop-project/project-config.json
      - HOP_ENVIRONMENT_NAME=local
      - HOP_ENVIRONMENT_CONFIG_FILE=/files/hop-project/project-config.json
      - HOP_LOG_LEVEL=Basic
    volumes:
      - ../:/files
      - ./sqlite:/files/infra/sqlite
      - ../database:/files/database
      - ../hop-project:/files/hop-project
      - hop_web_config:/root/.hop
    networks:
      - hop-network
    ports:
      - "8085:8080"
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: hop-metabase
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase/metabase.db
      - JAVA_TIMEZONE=America/Manaus
    volumes:
      - ./metabase:/metabase
      - ./sqlite:/data
    networks:
      - hop-network
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  hop_plugins:
    driver: local
  hop_web_config:
    driver: local

networks:
  hop-network:
    driver: bridge
